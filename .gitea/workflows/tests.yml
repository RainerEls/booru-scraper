name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run the tests
        run: python3 -m pytest -q
