<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booru Scraper{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>">
  <script>
    try {
      const savedTheme = localStorage.getItem('booru_theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <a class="skip-link" href="#content">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="topbar-title display">Booru <span>Scraper</span></h1>
      <nav class="topbar-nav" aria-label="Main">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Scrape</a>
        <a href="/activity" class="nav-link {% if request.url.path == '/activity' %}active{% endif %}" {% if request.url.path == '/activity' %}aria-current="page"{% endif %}>Activity</a>
        <label class="sr-only" for="theme">Theme</label>
        <select id="theme" class="theme-select">
          <option value="">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        {% if logged_in(request) %}
        <form method="post" action="/logout"><button type="submit" class="nav-link nav-button">Log out</button></form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="page-wrap" id="content">
    {% block content %}{% endblock %}
  </main>

  <script>
    const themeSelect = document.getElementById('theme');
    themeSelect.value = document.documentElement.dataset.theme || '';
    themeSelect.addEventListener('change', () => {
      if (themeSelect.value) {
        document.documentElement.dataset.theme = themeSelect.value;
        localStorage.setItem('booru_theme', themeSelect.value);
      } else {
        delete document.documentElement.dataset.theme;
        localStorage.removeItem('booru_theme');
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
