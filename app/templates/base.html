<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booru Scraper{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="topbar-title display">Booru <span>Scraper</span></span>
      <nav class="topbar-nav">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Scrape</a>
        <a href="/history" class="nav-link {% if request.url.path == '/history' %}active{% endif %}">History</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
